services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: apibrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apibrain
      POSTGRES_PASSWORD: apibrain_dev_password
      POSTGRES_DB: apibrain
    ports:
      - "5432:5432"
    volumes:
      - apibrain_pgdata:/var/lib/postgresql/data
    
  redis:
    image: redis:7-alpine
    container_name: apibrain-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - apibrain_redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: apibrain-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: apibrain
      MINIO_ROOT_PASSWORD: apibrain_dev_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - apibrain_minio_data:/data

volumes:
  apibrain_pgdata:
  apibrain_redis_data:
  apibrain_minio_data: